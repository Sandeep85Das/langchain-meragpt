[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-meragpt"
version = "0.1.0"
description = "LangChain integration for meraGPT Decider 1: typed decisions with calibrated probabilities, as a Runnable, a tool and agent middleware"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "meraGPT" }]
keywords = ["langchain", "meragpt", "decider", "decisions", "classification", "middleware", "agents", "routing", "guardrails"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "langchain-core>=1.4.0,<2.0.0",
    "langchain>=1.4.5,<2.0.0",
    "langgraph>=1.2.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[project.urls]
Homepage = "https://meragpt.com"
Documentation = "https://meragpt.com/docs/decider"
"Source Code" = "https://github.com/Sandeep85Das/langchain-meragpt"
repository = "https://github.com/Sandeep85Das/langchain-meragpt"

[dependency-groups]
test = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.2,<1.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "langchain-tests>=1.0.0,<2.0.0",
]
lint = ["ruff>=0.5"]
typing = ["mypy>=1.10,<2.0"]

[tool.hatch.build.targets.sdist]
include = ["langchain_meragpt", "tests", "examples", "README.md", "LICENSE"]

[tool.mypy]
disallow_untyped_defs = "True"

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "T201"]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["T201"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
markers = ["compile: placeholder used to compile integration tests without running them"]
asyncio_mode = "auto"
